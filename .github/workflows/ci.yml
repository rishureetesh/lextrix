name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit -w lextrix

  serialize:
    name: Serialization package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -w lextrix-serialize
      - run: npm run test -w lextrix-core

  fuzz:
    name: Fuzz tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      - run: npm run test:fuzz -w lextrix

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: packages/lextrix
      - uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e -- --project=chromium --headed
          working-directory: packages/lextrix

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, unit, serialize, fuzz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lextrix-dist
          path: packages/lextrix/dist/dist/*
          if-no-files-found: error
