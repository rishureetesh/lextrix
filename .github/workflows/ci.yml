name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npx playwright install --with-deps
      - run: npm run test:unit -w @reetesh/lextron
        env:
          BROWSER: ${{ matrix.browser }}

  fuzz:
    name: Fuzz tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      - run: npm run test:fuzz -w @reetesh/lextron

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npx playwright install --with-deps
        working-directory: packages/lextron
      - uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e -- --headed
          working-directory: packages/lextron

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, unit, fuzz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-rollup-native.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lextron-dist
          path: packages/lextron/dist/dist/*
          if-no-files-found: error
