version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lextrix
      POSTGRES_PASSWORD: lextrix
      POSTGRES_DB: lextrix
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lextrix']
      interval: 2s
      timeout: 5s
      retries: 10
